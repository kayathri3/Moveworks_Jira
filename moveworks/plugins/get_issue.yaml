# Moveworks Action Plugin – Get Jira Issue
#
# Import this file into Moveworks Creator Studio under
# Plugins > Action Plugins > Import Plugin.
#
# The bot will invoke this action when an employee says something like:
#   "What is the status of OPS-42?"
#   "Show me the details for ticket IT-100"

name: get_jira_issue
description: Retrieves details of a specific Jira issue by its key.

action:
  http:
    method: GET
    url: "{{JIRA_INTEGRATION_BASE_URL}}/jira/issue/{{issue_key}}"
    headers:
      Authorization: "******"

input_schema:
  type: object
  required:
    - issue_key
  properties:
    issue_key:
      type: string
      description: Jira issue key, e.g. OPS-42

output_schema:
  type: object
  properties:
    key:
      type: string
    summary:
      type: string
    status:
      type: string
    priority:
      type: string
    issue_type:
      type: string
    assignee:
      type: string
    reporter:
      type: string
    description:
      type: string
    created:
      type: string
    updated:
      type: string
    url:
      type: string

output_template: |
  📋 **{{key}}** – {{summary}}
  • Status: {{status}}
  • Priority: {{priority}}
  • Type: {{issue_type}}
  • Assignee: {{assignee}}
  • Reporter: {{reporter}}
  • Created: {{created}}
  🔗 {{url}}
