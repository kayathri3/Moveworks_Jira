app = "projector-token-relay"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "token_data"
  destination = "/data"

[env]
  TOKEN_STORE_PATH = "/data/token_store.json"
